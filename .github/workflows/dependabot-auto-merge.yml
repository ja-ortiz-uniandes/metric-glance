name: Dependabot auto-merge

# Auto-merges Dependabot PRs with no human step. Scoped to the github-actions
# ecosystem only (the sole ecosystem in .github/dependabot.yml); npm/uv deps
# are handled by the scheduled maintenance workflow instead, never by
# Dependabot PRs, so there is nothing else here to gate.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
