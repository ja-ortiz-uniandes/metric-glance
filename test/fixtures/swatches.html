<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Size swatches behind a hit layer</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 40px; }
    /* Amazon's pattern: a transparent submit input stretched over the whole
       button takes every click, so a point over the swatch resolves to a
       control that holds no text of its own. */
    .swatches { list-style: none; display: flex; gap: 12px; padding: 0; margin: 0; }
    .swatch { position: relative; display: inline-block; border: 1px solid #999; padding: 12px 16px; }
    .hit { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
    /* The same shape with a stretched link instead of an input, the other half
       of what Amazon renders. */
    .overlay-link { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    /* Amazon's swatch label is a flex container. That matters: a flex container
       generates no item for a whitespace-only text node, and trims the edge
       whitespace of the anonymous items around it, so an ordinary space
       inserted next to a converted value does not render at all. */
    .flex-label { display: flex; }
  </style>
</head>
<body>
  <h1>Swatches</h1>
  <ul class="swatches">
    <li id="li0">
      <span class="swatch">
        <input type="submit" class="hit" aria-labelledby="sw0" />
        <span id="sw0" aria-hidden="true"> 24"W x 12"H </span>
      </span>
    </li>
    <li id="li1">
      <span class="swatch">
        <input type="submit" class="hit" aria-labelledby="sw1" />
        <span id="sw1" aria-hidden="true"> 36"W x 18"H </span>
      </span>
    </li>
    <li id="li2">
      <span class="swatch">
        <span id="sw2" aria-hidden="true"> 36"L x 18"W x 4"D </span>
        <a class="overlay-link" href="#nope"></a>
      </span>
    </li>
  </ul>

  <!-- The real Amazon shape: the label is a flex container, so the spacing has
       to be built from something a flex container does not throw away. -->
  <ul class="swatches">
    <li id="li3">
      <span class="swatch">
        <input type="submit" class="hit" aria-labelledby="sw3" />
        <span id="sw3" class="flex-label" aria-hidden="true"> 24"W x 12"H </span>
      </span>
    </li>
  </ul>

  <!-- Lowercase axis letters happen too. -->
  <p id="lower">Panel size 48"w x 24"h fits most windows.</p>

  <!-- The axis letter is the page's text, not ours, so it must survive. -->
  <p id="prose">Choose the 72"W x 36"H panel for a picture window.</p>
</body>
</html>
